<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="大肥鱼"><title>大肥鱼 · 桌宠</title>
<style>html,body{margin:0;height:100%}body{background:linear-gradient(180deg,#1c1f33,#181a26 40%);color:#edf0ff;font:15px/1.7 system-ui,sans-serif;padding:clamp(16px,5vw,56px);-webkit-tap-highlight-color:transparent}main{max-width:960px;margin:auto}h1{font-size:clamp(30px,6vw,44px);line-height:1.2;letter-spacing:-.03em;margin:.2em 0 .1em}p.sub{color:#a7acc1;margin:0 0 4px}.eyebrow{font-size:11px;letter-spacing:.2em;color:#9fafd9}.pets{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;margin:28px 0}jingjing-pet{min-width:260px;min-height:260px;display:block}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}button{background:#ffffff0b;border:1px solid #ffffff20;color:#cad3f0;border-radius:9px;padding:8px 13px;cursor:pointer;font-size:13px}button.primary{background:#3b4a9f;border-color:#5b6ad0;color:#fff}button:hover{background:#ffffff14}.foot{color:#6f7390;font-size:12px;margin-top:26px;border-top:1px solid #ffffff12;padding-top:14px}.demo{display:flex;flex-wrap:wrap;gap:8px}.demo button{font-size:12px;padding:6px 11px}</style></head>
<body><main><span class="eyebrow">WEB · PWA · 双宠</span><h1>大肥鱼，陪你认真摸鱼。</h1><p class="sub">点击打招呼、悬停跳跃、拖动奔跑、投喂休息。多只鲸鲸娘同屏——每只都独立互动。</p>
<section class="pets">
  <div><jingjing-pet src="https://cdn.jsdelivr.net/gh/zhouwu97/ds-pet@1a4acdc33f4306dc8b8a3b25bb392b354f56bf18/codex/jingjing-spritesheet.png" storage-key="jingjing-main"></jingjing-pet><div class="controls"><button class="primary" data-say="0">随机台词</button><button data-act="waving" data-pet="0">打招呼</button><button data-act="jumping" data-pet="0">投喂</button></div></div>
  <div><jingjing-pet src="https://cdn.jsdelivr.net/gh/zhouwu97/ds-pet@1a4acdc33f4306dc8b8a3b25bb392b354f56bf18/codex/jingjing-spritesheet.png" storage-key="jingjing-comp"></jingjing-pet><div class="controls"><button class="primary" data-say="1">随机台词</button><button data-act="waving" data-pet="1">打招呼</button><button data-act="jumping" data-pet="1">投喂</button></div></div>
</section>
<div class="demo">状态演示（动画反映宿主状态）：<button data-state="idle">空闲</button><button data-state="running">工作</button><button data-state="waiting">等待</button><button data-state="review">完成</button><button data-state="failed">失败</button></div>
<div class="foot">同一只鲸鲸娘，两只一起陪你。以上按钮只演示宿主状态，不读取账户或会话。</div>
</main>
<script type="module">
const REF='1a4acdc33f4306dc8b8a3b25bb392b354f56bf18';
const { registerJingjingPet } = await import('https://cdn.jsdelivr.net/gh/zhouwu97/ds-pet@'+REF+'/web/jingjing-pet.js');
registerJingjingPet();
const pets = document.querySelectorAll('jingjing-pet');
const LINES = ['冒泡～本鱼今日也在认真摸鱼🐋','戳我干啥，是要投喂吗？','呜哇，被你发现了～','工作？再摸五分钟就干～','翻个肚皮，舒舒服服～','你回来啦，本鱼想你了！','本鱼会游泳、会卖萌、还会摸鱼','再戳我，本鱼可就跑咯～'];
const say = (i,text)=>pets[i].play('waving', text);
document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.say; say(i, LINES[Math.floor(Math.random()*LINES.length)]); });
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.pet; pets[i].play(b.dataset.act, b.dataset.act==='jumping' ? '啊呜，谢谢你的投喂！' : '在呢在呢，陪你一起摸鱼～'); });
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>pets.forEach(p=>p.setActivity(b.dataset.state)));
</script></body></html>
